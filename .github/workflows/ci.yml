# Every rail on every push (docs/quality-rails.md). Node is needed as well as Bun:
# Vitest and Stryker run on Node, and the Oxlint preset loads oxlint.config.ts with Node.
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run mutate
